name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e .

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Test CLI help
        run: python hash_cracker.py --help

      - name: Test hash identification
        run: python hash_cracker.py -H 5f4dcc3b5aa765d61d8327deb882cf99

      - name: Test JSON output
        run: python hash_cracker.py -H 5f4dcc3b5aa765d61d8327deb882cf99 --output-format json

      - name: Test version
        run: python hash_cracker.py --version

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flake8
        run: pip install flake8

      - name: Lint
        run: flake8 hashcracker/ --max-line-length=120 --ignore=E501,W503
